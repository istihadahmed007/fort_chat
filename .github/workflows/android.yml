name: Android CI & Release Build

on:
  push:
    branches: [ "main", "codex/fix-firebase-backend" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Cloud Functions Dependencies
      run: |
        cd functions
        npm ci

    - name: Set up JDK 21 for Firebase Emulators
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run Firebase Emulator Suite & Security Rules Tests
      env:
        FUNCTIONS_DISCOVERY_TIMEOUT: 60000
        FORT_TURN_HOSTS: turn:turn.example.invalid:3478,turns:turn.example.invalid:5349
        FORT_TURN_SHARED_SECRET: test-only-turn-secret
        FORT_TURN_TTL_SECONDS: 3600
      run: npx --yes firebase-tools emulators:exec --project demo-fort-chat --only firestore,functions,auth "node test_emulator_rules.js"

    - name: Restore JDK 17 for Android build
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fort-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: true
        fail_on_unmatched_files: false
        body: |
          ## Fort Messenger v1.0.0 — Sovereign Sanctuary Production Release

          ### Security & Cryptography:
          - **Sender-Authenticated E2EE:** NIST P-256 ECDH key agreement with NIST P-256 ECDSA digital signatures (`SHA256withECDSA`).
          - **Fail-Closed Hardware Protection:** AES-256-GCM master key protected by Android KeyStore.
          - **Encrypted Local Storage:** Room database protects messages with AES-256-GCM cipher payloads (`encryptedLocalPayload`).
          - **Atomic Single-Use Passes:** Concurrency-safe contact passes and server-side authorization in `firestore.rules`.
          - **PBKDF2 Password Hashing:** PBKDF2WithHmacSHA256 credential hashing replacing legacy hash functions.

          ### Modern Messenger Features:
          - In-conversation text search.
          - Quoted replies with preview banner.
          - Real-time emoji message reactions with toggle support.
          - Message editing with `(edited)` visual badge.
          - Message deletion with privacy tombstone.
          - Delivery and read receipts (`PENDING`, `SENT`, `DELIVERED`, `READ`).
          - Multi-type attachment picker.
          - Real offline outbox queueing and manual/automatic retry.
          - Circles & rooms administration (invite dialog with roles, member kick, leave room).
          - Online presence and typing indicator privacy toggles.
          - Real authentication: Email/Password, 6-digit Phone OTP, Google Sign-In, Password Reset.

          ### Download APK:
          Download `app-debug.apk` below to install directly on Android devices.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
