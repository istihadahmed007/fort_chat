name: Android CI & Release Build

on:
  push:
    branches: [ "main", "codex/fix-firebase-backend" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Install Cloud Functions Dependencies
      run: |
        cd functions
        npm ci

    - name: Set up JDK 21 for Firebase Emulators
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run Firebase Emulator Suite & Security Rules Tests
      env:
        FUNCTIONS_DISCOVERY_TIMEOUT: 60000
        FORT_TURN_HOSTS: turn:turn.example.invalid:3478,turns:turn.example.invalid:5349
        FORT_TURN_SHARED_SECRET: test-only-turn-secret
        FORT_TURN_TTL_SECONDS: 3600
      run: npx --yes firebase-tools emulators:exec --project demo-fort-chat --only firestore,functions,auth "node test_emulator_rules.js"

    - name: Restore JDK 17 for Android build
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fort-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Determine Release Details
      id: release_info
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=Fort Chat $TAG_NAME — Sovereign Sanctuary Release" >> $GITHUB_OUTPUT
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
          echo "title=Fort Chat Latest Build" >> $GITHUB_OUTPUT
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: ${{ steps.release_info.outputs.title }}
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
        generate_release_notes: true
        fail_on_unmatched_files: false
        body: |
          ## Fort Chat — Sovereign Sanctuary Release (${{ steps.release_info.outputs.tag }})

          ### Direct APK Download:
          - **[Download app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/app-debug.apk)**

          ### Key Features & Security:
          - **Ice-Blue Liquid-Glass UI:** Modern frosted glass surfaces, deep-navy text, and royal-blue action buttons across Chats, Knock First Requests, and Conversation screens.
          - **Sender-Authenticated E2EE:** NIST P-256 ECDH key agreement with NIST P-256 ECDSA digital signatures (`SHA256withECDSA`).
          - **Fail-Closed Hardware Protection:** AES-256-GCM master key protected by Android KeyStore.
          - **Encrypted Local Storage:** Room database protects messages with AES-256-GCM cipher payloads (`encryptedLocalPayload`).
          - **Knock First Protocol:** Verified inviter & request inspection, consent triage (Accept, Decline, Block), with pending requests quarantined until explicit recipient action.
          - **Quiet Presence:** Granular audience control with clear expiry timers.
          - **WebRTC Calling:** Authenticated 1-to-1 audio and video calling limited to accepted contacts.
          - **Trusted Pass Claim Functions:** Firebase Cloud Functions backend with atomic single-use Firestore transactions.
          - **Multi-factor Onboarding:** Email/Password, 6-digit Phone OTP, Google Sign-In, Password Reset.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
